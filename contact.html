<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Hotel Stay</title>
    <link rel="stylesheet" href="contact.css" />
  </head>
  <body>
    <div class="contact-container">
      <h1>Contact Us</h1>
      <p class="subtitle">We'd love to hear from you. Get in touch with us today!</p>
      
      <form class="contact-form">
        <div class="form-group">
          <label for="name" id="name">Full Name *</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="Cedrick Ngige" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Cedrick@gmail.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="(+254) 7123456789" 
          />
        </div>

        <div class="form-group">
          <label for="subject">Subject *</label>
          <input 
            type="text" 
            id="subject" 
            name="subject" 
            placeholder="How can we help?" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="message">Message *</label>
          <textarea 
            id="message" 
            name="message" 
            rows="6" 
            placeholder="Please tell us more about your inquiry..." 
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>
  </body>
</html>
